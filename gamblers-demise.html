<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gamblers Demise</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<h1 class="game-title">Gamblers Demise</h1>

<!-- ══════════════════════════════════════════════════════
     PHASE 1: DESIGN YOUR CASINO
═══════════════════════════════════════════════════════ -->
<div id="phase1" class="phase">
<div class="phase-label">Phase 1 — Design Your Casino</div>
<div class="bunny-counter">Bunny Count: <span id="bunnyCount">0</span> / 15</div>
<div id="casinoFloor">

<!-- Entrance markers -->
<span class="entrance-left">Enter</span>
<div class="door-notch-left"></div>
<div class="door-notch"></div>
<span class="entrance-bottom">Enter</span>

<!-- ── TOP ROW: Zone 1 slot bank + Bar ─────────────── -->
<div class="top-row">
<div class="slot-bank-top">
<div class="zone-label" style="align-self:center; writing-mode:vertical-lr; margin-right:6px;">1</div>

<!-- Slot 1 -->
<div class="slotMachine horizontal">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot1"></button>
</div>

<!-- Slot 2 -->
<div class="slotMachine horizontal">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot2"></button>
</div>

<!-- Slot 3 -->
<div class="slotMachine horizontal">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot3"></button>
</div>

</div><!-- /slot-bank-top -->
<div class="bar-area">Bar</div>
</div><!-- /top-row -->

<!-- ── LEFT COLUMN: Zone 2 ──────────────────────────── -->
<div class="slot-bank-left locked" id="zone2">
<div class="zone-label">2</div>

<!-- Slot 4 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot4"></button>
</div>

<!-- Slot 5 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot5"></button>
</div>

<!-- Slot 6 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot6"></button>
</div>

<!-- Unlock button for Zone 2 -->
<button class="zone-unlock-btn" data-zone="2" data-cost="2000">
<span class="pill">
<span class="price">$2K</span>
<span class="label">Unlock Zone 2</span>
</span>
</button>
</div><!-- /slot-bank-left -->

<!-- ── CENTER: open floor watermark ───────────────── -->
<div class="center-area">
<div class="zone-number">3</div>
</div>

<!-- ── RIGHT COLUMN: Zone 3 ──────────────────────── -->
<div class="slot-bank-right locked zone3-disabled" id="zone3">
<div class="zone-label" style="text-align:right;">3</div>

<!-- Slot 7 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot7"></button>
</div>

<!-- Slot 8 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot8"></button>
</div>

<!-- Slot 9 -->
<div class="slotMachine">
<div class="slotVisual">
<div class="reel-row">
<div class="reel"></div>
<div class="reel"></div>
<div class="reel"></div>
</div>
</div>
<button class="slotHitbox" id="slot9"></button>
</div>

<!-- Unlock button for Zone 3 -->
<button class="zone-unlock-btn" data-zone="3" data-cost="2000">
<span class="pill">
<span class="price">$2K</span>
<span class="label">Unlock Zone 3</span>
</span>
</button>
</div><!-- /slot-bank-right -->

</div><!-- /#casinoFloor -->
</div><!-- /#phase1 -->


<!-- ══════════════════════════════════════════════════════
     MACHINE SETTINGS MENU — hidden pop-up panel for slot
     machines. Triggered by JS when any #slot1..#slot9 is
     clicked. JS should set #machineMenu's data-target attr
     to the clicked slot's id, then remove .hidden.
═══════════════════════════════════════════════════════ -->
<div id="machineMenu" class="hidden" data-target="">
<h3>Machine Settings</h3>

<div class="menu-target">Editing: <span id="menuTargetLabel">—</span></div>

<div class="menu-field">
<label for="sliderWinRate">Win Rate</label>
<input type="range" id="sliderWinRate" min="0" max="100" value="20" />
<span class="range-val" id="valWinRate">20%</span>
</div>

<div class="menu-field">
<label for="sliderPayout">Payout Multiplier</label>
<input type="range" id="sliderPayout" min="1" max="20" value="5" />
<span class="range-val" id="valPayout">5×</span>
</div>

<div class="menu-field">
<label for="sliderStartMoney">Starting Player Money</label>
<input type="range" id="sliderStartMoney" min="100" max="5000" step="100" value="1000" />
<span class="range-val" id="valStartMoney">$1000</span>
</div>

<button id="menuClose">Close</button>
</div>

<!-- Backdrop for the settings modal -->
<div id="menuBackdrop" class="hidden"></div>


<!-- ══════════════════════════════════════════════════════
     PHASE 2: VICTIM MODE
═══════════════════════════════════════════════════════ -->
<div id="phase2" class="phase hidden">
<div class="phase-label">Phase 2 — Victim Mode</div>
<div class="hud">
<div>Money: $<span id="money">1000</span></div>
<div><span id="timer">05:00</span></div>
</div>
<button id="playBtn">PLAY</button>
<div id="lastResult"></div>
</div><!-- /#phase2 -->


<!-- ══════════════════════════════════════════════════════
     PHASE 3: END SCREEN
═══════════════════════════════════════════════════════ -->
<div id="phase3" class="phase hidden">
<div class="phase-label">Phase 3 — End Screen</div>
<h2>Game Over</h2>
<div>
<div class="survive-label">Time Survived</div>
<span id="surviveTime"></span>
</div>
<p id="endMessage"></p>
</div><!-- /#phase3 -->

</body>
</html>
