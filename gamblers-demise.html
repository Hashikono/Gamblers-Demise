<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gamblers Demise</title>
<link rel="stylesheet" href="css/styles.css" />
<script type="text/javascript" src="js/main.js"></script>
</head>
<body>
<h1 class="game-title">Gamblers Demise</h1>


<!-- ══════════════════════════════════════════════════════
     START MENU
═══════════════════════════════════════════════════════ -->

<div id="startMenu" class="start-menu">
  <div class="start-menu-inner">
    <h2 class="start-title">Welcome</h2>
    <button id="play_btn" class="menu-btn">Play</button>
    <button id="cheat_open_btn" class="menu-btn">Settings</button>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     CHEAT / SETTINGS POPUP
═══════════════════════════════════════════════════════ -->
<div id="cheatPopup" class="hidden">
  <div class="cheat-popup-inner">
    <h3>Settings</h3>

    <div class="cheat-field">
      <label for="cheat_playerMoney">Starting Player Money</label>
      <input type="range" id="cheat_playerMoney" min="1000" max="10000" step="1000" value="1000">
      <output for="cheat_playerMoney">1000</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_bunnyMoney">Starting Bunny Money</label>
      <input type="range" id="cheat_bunnyMoney" min="100" max="1000" step="100" value="100">
      <output for="cheat_bunnyMoney">100</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_maxBunnies">Max Bunnies per Machine</label>
      <input type="range" id="cheat_maxBunnies" min="1" max="10" step="1" value="5">
      <output for="cheat_maxBunnies">5</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_maxTries">Max Bunny Tries</label>
      <input type="range" id="cheat_maxTries" min="1" max="5" step="1" value="3">
      <output for="cheat_maxTries">3</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_whiteRabbitChance">White Rabbit Chance %</label>
      <input type="range" id="cheat_whiteRabbitChance" min="1" max="100" step="1" value="100">
      <output for="cheat_whiteRabbitChance">100</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_playerTries">Max Player Gambles</label>
      <input type="range" id="cheat_playerTries" min="1" max="10" step="1" value="4">
      <output for="cheat_playerTries">4</output>
    </div>

    <div class="cheat-field">
      <label for="cheat_gainPercent">Gain % per Bunny</label>
      <input type="range" id="cheat_gainPercent" min="1" max="100" step="1" value="100">
      <output for="cheat_gainPercent">100</output>
    </div>

    <button id="cheat_submit_btn" class="menu-btn cheat-submit">Save & Close</button>
  </div>
</div>


<!-- ══════════════════════════════════════════════════════
     PHASE 1
═══════════════════════════════════════════════════════ -->
<div id="phase1" class="hidden">
  <div class="phase-label">Phase 1 — Design Your Casino</div>

  <!-- HUD row: bunny counter + money -->
  <div class="phase1-hud">
    <div class="bunny-counter">
      Bunnies: <span id="bunnyCount">0</span> / <span id="bunnyMax">0</span>
    </div>
    <div class="money-counter">
      Money: $<span id="playerMoneyDisplay">1000</span>
    </div>
  </div>

  <div id="casinoFloor">
    <span class="entrance-left">Enter</span>
    <div class="door-notch-left"></div>
    <div class="door-notch"></div>
    <span class="entrance-bottom">Enter</span>

    <div class="top-row">
      <div class="slot-bank-top">
        <div class="zone-label" style="align-self:center; writing-mode:vertical-lr; margin-right:6px;">1</div>

        <div class="slotMachine horizontal" data-slot="1">
          <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
          <button class="slotHitbox" id="slot1"></button>
        </div>

        <div class="slotMachine horizontal" data-slot="2">
          <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
          <button class="slotHitbox" id="slot2"></button>
        </div>

        <div class="slotMachine horizontal" data-slot="3">
          <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
          <button class="slotHitbox" id="slot3"></button>
        </div>
      </div>
      <div class="bar-area">Bar</div>
    </div>

    <div class="slot-bank-left locked" id="zone2">
      <div class="zone-label">2</div>

      <div class="slotMachine" data-slot="4">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot4"></button>
      </div>

      <div class="slotMachine" data-slot="5">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot5"></button>
      </div>

      <div class="slotMachine" data-slot="6">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot6"></button>
      </div>

      <button class="zone-unlock-btn" data-zone="2" data-cost="2000">
        <span class="pill">
          <span class="price">$2K</span>
          <span class="label">Unlock Zone 2</span>
        </span>
      </button>
    </div>

    <div class="center-area">
      <div class="zone-number">3</div>
    </div>

    <div class="slot-bank-right locked zone3-disabled" id="zone3">
      <div class="zone-label" style="text-align:right;">3</div>

      <div class="slotMachine" data-slot="7">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot7"></button>
      </div>

      <div class="slotMachine" data-slot="8">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot8"></button>
      </div>

      <div class="slotMachine" data-slot="9">
        <div class="slotVisual"><img src="assets/slot-machine.svg" alt="" /></div>
        <button class="slotHitbox" id="slot9"></button>
      </div>

      <button class="zone-unlock-btn" data-zone="3" data-cost="2000">
        <span class="pill">
          <span class="price">$2K</span>
          <span class="label">Unlock Zone 3</span>
        </span>
      </button>
    </div>

    <!-- Bunnies will be appended here by JS -->
    <div id="bunnyLayer"></div>
  </div><!-- /#casinoFloor -->

  <button id="startDayBtn" class="start-day-btn">Start Day</button>
</div><!-- /#phase1 -->


<!-- SLOT MACHINE SETTINGS POPUP -->
<div id="machinePopup" class="hidden">
  <div class="machine-popup-inner">
    <h3>Slot <span id="machineTargetLabel">1</span> Settings</h3>

    <div class="machine-field">
      <label for="parameter_winRate">Win Rate: <span id="winRateVal">50</span>%</label>
      <input type="range" id="parameter_winRate" min="0" max="100" step="5" value="50">
    </div>

    <div class="machine-field">
      <label for="parameter_payout">Payout Multiplier</label>
      <select id="parameter_payout">
        <option value="1">1×</option>
        <option value="1.5">1.5×</option>
        <option value="2" selected>2×</option>
        <option value="2.5">2.5×</option>
        <option value="3">3×</option>
      </select>
    </div>

    <div class="machine-field">
      <label for="parameter_minBet">Minimum Bet: $<span id="minBetVal">50</span></label>
      <input type="range" id="parameter_minBet" min="0" max="100" step="5" value="50">
    </div>

    <div class="machine-field">
      <label for="parameter_override">Override Win Rate: <span id="overrideVal">Off</span></label>
      <input type="range" id="parameter_override" min="0" max="1" step="1" value="0">
    </div>

    <button id="machine_submit_btn" class="menu-btn">Save & Close</button>
  </div>
</div>


<!-- PHASE 2 -->
<div id="phase2" class="hidden">
  <div class="phase-label">Phase 2 — Victim Mode</div>
  <div class="hud">
    <div>Money: $<span id="money">1000</span></div>
    <div><span id="timer">05:00</span></div>
  </div>
  <button id="playBtn">PLAY</button>
  <div id="lastResult"></div>
</div>


<!-- PHASE 3 -->
<div id="phase3" class="hidden">
  <div class="phase-label">Phase 3 — End Screen</div>
  <h2>Game Over</h2>
  <div>
    <div class="survive-label">Time Survived</div>
    <span id="surviveTime"></span>
  </div>
  <p id="endMessage"></p>
</div>
<audio id="sfx_startGamble" src="assets/sounds/lets_go_gambling.mp3" preload="auto"></audio>
</body>
</html>
