<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">

  <!-- ═══════════════════════════════════════════════════════
       DEFS — gradients, patterns, filters
  ═══════════════════════════════════════════════════════ -->
  <defs>

    <!-- Carpet base: deep red, lit from above -->
    <linearGradient id="carpetBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b1f2a"/>
      <stop offset="55%"  stop-color="#4a1620"/>
      <stop offset="100%" stop-color="#2d0d16"/>
    </linearGradient>

    <!-- Path color: lighter red carpet runner -->
    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9c3a4f"/>
      <stop offset="100%" stop-color="#7a2638"/>
    </linearGradient>

    <!-- Machine zone: subtle purple tonal shift -->
    <radialGradient id="zoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3d2a55" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#2d1b3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2d1b3d" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm pool of light over zones -->
    <radialGradient id="lightPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e8c87a" stop-opacity="0.28"/>
      <stop offset="50%"  stop-color="#c9a961" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </radialGradient>

    <!-- Bar area: cooler blue lighting -->
    <radialGradient id="barLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3a5a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0f1a3d" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>

    <!-- Entrance glow -->
    <radialGradient id="entranceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#e8c87a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
    </radialGradient>

    <!-- Carpet swirl pattern (damask-style) -->
    <pattern id="swirlPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#8a3548" stroke-width="1.2" stroke-opacity="0.35">
        <!-- Main swirl -->
        <path d="M 60,20 C 80,20 90,40 80,55 C 72,68 55,65 52,52 C 50,42 58,35 65,38 C 70,40 70,48 65,50"/>
        <!-- Mirror swirl -->
        <path d="M 60,100 C 40,100 30,80 40,65 C 48,52 65,55 68,68 C 70,78 62,85 55,82 C 50,80 50,72 55,70"/>
        <!-- Corner ornaments -->
        <path d="M 10,10 Q 20,15 15,25 Q 10,30 5,20 Z"/>
        <path d="M 110,10 Q 100,15 105,25 Q 110,30 115,20 Z"/>
        <path d="M 10,110 Q 20,105 15,95 Q 10,90 5,100 Z"/>
        <path d="M 110,110 Q 100,105 105,95 Q 110,90 115,100 Z"/>
        <!-- Center diamond -->
        <path d="M 60,55 L 65,60 L 60,65 L 55,60 Z" fill="#c9a961" fill-opacity="0.15" stroke="none"/>
      </g>
    </pattern>

    <!-- Gold trim filter — soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

  </defs>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 1 — Carpet base
  ═══════════════════════════════════════════════════════ -->
  <rect width="1600" height="1000" fill="url(#carpetBase)"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 2 — Carpet swirl pattern
  ═══════════════════════════════════════════════════════ -->
  <rect width="1600" height="1000" fill="url(#swirlPattern)" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 3 — Winding paths
       Maps to HTML: entrance bottom-center → snakes around zones
  ═══════════════════════════════════════════════════════ -->

  <!-- Main path: bottom entrance → curves around right zone → loops up to top → ends near bar -->
  <path d="
    M 800,1000
    C 800,920 720,880 640,860
    C 540,835 460,790 480,700
    C 500,620 620,610 700,560
    C 780,510 760,420 680,380
    C 600,345 480,360 420,300
    C 370,250 400,170 500,150
    C 620,128 760,140 880,150
    C 1020,162 1180,155 1280,200
  "
    fill="none"
    stroke="url(#pathGrad)"
    stroke-width="110"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"/>

  <!-- Secondary path: side loop to left zone -->
  <path d="
    M 480,700
    C 380,720 280,680 220,580
    C 180,500 200,400 280,360
    C 340,330 400,340 420,300
  "
    fill="none"
    stroke="url(#pathGrad)"
    stroke-width="80"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"/>

  <!-- Tertiary dead-end path (the "confusing maze" feel) -->
  <path d="
    M 700,560
    C 820,580 920,540 980,480
    C 1020,440 1040,400 1060,360
  "
    fill="none"
    stroke="url(#pathGrad)"
    stroke-width="65"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"/>

  <!-- Gold trim along main path -->
  <path d="
    M 800,1000
    C 800,920 720,880 640,860
    C 540,835 460,790 480,700
    C 500,620 620,610 700,560
    C 780,510 760,420 680,380
    C 600,345 480,360 420,300
    C 370,250 400,170 500,150
    C 620,128 760,140 880,150
    C 1020,162 1180,155 1280,200
  "
    fill="none"
    stroke="#c9a961"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.4"
    stroke-dasharray="0"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 4 — Machine zones
       Mapped to your HTML grid:
         Zone 1 (top row):     ~x:280-1080, y:80-220
         Bar area:             ~x:1180-1480, y:80-260
         Zone 2 (left col):    ~x:120-280,  y:340-820
         Zone 3 (right col):   ~x:1280-1480, y:340-820
  ═══════════════════════════════════════════════════════ -->

  <!-- Zone 1: top slot bank -->
  <rect x="240" y="60" width="880" height="200" rx="20"
        fill="url(#zoneGlow)"/>

  <!-- Bar area (cooler tone) -->
  <rect x="1160" y="60" width="340" height="220" rx="20"
        fill="url(#barLight)"/>

  <!-- Zone 2: left column -->
  <rect x="80" y="320" width="240" height="540" rx="20"
        fill="url(#zoneGlow)"/>

  <!-- Zone 3: right column -->
  <rect x="1280" y="320" width="240" height="540" rx="20"
        fill="url(#zoneGlow)"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 5 — Light pools over zones (warm atmospheric glow)
  ═══════════════════════════════════════════════════════ -->

  <!-- Top zone light pools (3 — one per slot in zone 1) -->
  <ellipse cx="420"  cy="160" rx="200" ry="120" fill="url(#lightPool)"/>
  <ellipse cx="700"  cy="160" rx="200" ry="120" fill="url(#lightPool)"/>
  <ellipse cx="980"  cy="160" rx="200" ry="120" fill="url(#lightPool)"/>

  <!-- Left zone light pool -->
  <ellipse cx="200" cy="590" rx="180" ry="280" fill="url(#lightPool)"/>

  <!-- Right zone light pool -->
  <ellipse cx="1400" cy="590" rx="180" ry="280" fill="url(#lightPool)"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 6 — Entrance markers
       HTML has: bottom-center entrance + left-middle entrance
  ═══════════════════════════════════════════════════════ -->

  <!-- Bottom entrance glow -->
  <ellipse cx="800" cy="980" rx="180" ry="60" fill="url(#entranceGlow)"/>

  <!-- Bottom entrance gold threshold strip -->
  <rect x="710" y="985" width="180" height="6" fill="#c9a961" opacity="0.7"/>
  <rect x="710" y="985" width="180" height="6" fill="#e8c87a" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Left entrance glow -->
  <ellipse cx="20" cy="500" rx="60" ry="100" fill="url(#entranceGlow)"/>

  <!-- Left entrance gold threshold strip -->
  <rect x="9" y="430" width="6" height="140" fill="#c9a961" opacity="0.7"/>
  <rect x="9" y="430" width="6" height="140" fill="#e8c87a" opacity="0.4" filter="url(#softGlow)"/>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 7 — Decorative accents
  ═══════════════════════════════════════════════════════ -->

  <!-- Center floor medallion (visual anchor for open zone 3 area in middle) -->
  <g transform="translate(800, 600)" opacity="0.18">
    <circle r="120" fill="none" stroke="#c9a961" stroke-width="1.5"/>
    <circle r="100" fill="none" stroke="#c9a961" stroke-width="1"/>
    <circle r="80"  fill="none" stroke="#c9a961" stroke-width="0.8"/>
    <!-- 8-point star -->
    <g stroke="#c9a961" stroke-width="1" fill="none">
      <line x1="-90" y1="0" x2="90" y2="0"/>
      <line x1="0" y1="-90" x2="0" y2="90"/>
      <line x1="-64" y1="-64" x2="64" y2="64"/>
      <line x1="-64" y1="64" x2="64" y2="-64"/>
    </g>
    <circle r="12" fill="#c9a961" opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       LAYER 8 — Vignette (always last)
  ═══════════════════════════════════════════════════════ -->
  <rect width="1600" height="1000" fill="url(#vignette)"/>

</svg>
