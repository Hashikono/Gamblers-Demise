<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">

  <!-- Body: oval (slightly elongated, pointing up = walking direction) -->
  <ellipse cx="20" cy="24" rx="9" ry="11"
           fill="#f5f0e8" stroke="#3d2418" stroke-width="1.2"/>

  <!-- Ears: two thin ellipses -->
  <ellipse cx="15.5" cy="9" rx="2" ry="6"
           fill="#f5f0e8" stroke="#3d2418" stroke-width="1.2"/>
  <ellipse cx="24.5" cy="9" rx="2" ry="6"
           fill="#f5f0e8" stroke="#3d2418" stroke-width="1.2"/>

  <!-- Inner ear pink -->
  <ellipse cx="15.5" cy="10" rx="0.8" ry="3" fill="#f4b8c4"/>
  <ellipse cx="24.5" cy="10" rx="0.8" ry="3" fill="#f4b8c4"/>

  <!-- Head: small circle -->
  <circle cx="20" cy="15" r="5.5"
          fill="#f5f0e8" stroke="#3d2418" stroke-width="1.2"/>

  <!-- Eyes: tiny dots -->
  <circle cx="17.5" cy="14.5" r="1" fill="#1a1a2e"/>
  <circle cx="22.5" cy="14.5" r="1" fill="#1a1a2e"/>

  <!-- Tiny pink nose -->
  <circle cx="20" cy="17" r="0.6" fill="#c0392b"/>

</svg>
