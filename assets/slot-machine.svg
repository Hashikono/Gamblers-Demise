<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">

  <!-- Body: rounded rectangle -->
  <rect x="10" y="10" width="90" height="140" rx="12" ry="12"
        fill="#3d1828" stroke="#c9a961" stroke-width="2"/>

  <!-- Top cap detail -->
  <rect x="22" y="20" width="66" height="14" rx="3" ry="3"
        fill="#1a0a14" stroke="#c9a961" stroke-width="1"/>

  <!-- Screen: small rectangle -->
  <rect x="22" y="44" width="66" height="44" rx="3" ry="3"
        fill="#0f0a0d" stroke="#c9a961" stroke-width="1.5"/>

  <!-- 3 tiny reel squares -->
  <rect x="28" y="54" width="14" height="24" fill="#ede8dc" stroke="#6b1f2a" stroke-width="1"/>
  <rect x="48" y="54" width="14" height="24" fill="#ede8dc" stroke="#6b1f2a" stroke-width="1"/>
  <rect x="68" y="54" width="14" height="24" fill="#ede8dc" stroke="#6b1f2a" stroke-width="1"/>

  <!-- Coin slot below screen -->
  <rect x="40" y="98" width="30" height="4" rx="1" ry="1" fill="#1a0a14"/>

  <!-- Payout tray -->
  <rect x="22" y="120" width="66" height="20" rx="2" ry="2"
        fill="#1a0a14" stroke="#c9a961" stroke-width="1"/>

  <!-- Lever: thin rectangle on side -->
  <rect x="102" y="50" width="4" height="42" rx="2" ry="2" fill="#c9a961"/>

  <!-- Lever knob: small circle -->
  <circle cx="104" cy="48" r="5" fill="#c0392b" stroke="#c9a961" stroke-width="1"/>

</svg>
